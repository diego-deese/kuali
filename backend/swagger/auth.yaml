paths:
  /api/auth/login:
    post:
      summary: Login to get access and refresh token
      tags:
        - Auth
      requestBody:
        description: Credentials to login on the system
        content:
          application/json:
            schema:
              type: object
              properties:
                institutional_email:
                  $ref: '#/components/schemas/User/properties/institutional_email'
                password: 
                  type: string
      responses:
        '200': 
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#components/schemas/UserSession'
        '401':
          description: Incorrect institutional email or password
          content:
            application/json:
              schema:
                $ref: '#components/schemas/Error'
        '500': 
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#components/schemas/Error'

  /api/auth/refresh:
    post:
      summary: Refresh user session
      tags:
        - Auth
      requestBody:
        description: Refresh token generated on the last session
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Successfully refreshed session
          content:
            application/json:
              schema:
                $ref: '#components/schemas/UserSession/properties/tokens'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#components/schemas/Error'
        '500': 
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#components/schemas/Error'

              
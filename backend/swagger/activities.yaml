paths:
  /activities:
    get:
      summary: List all the activities available for the user
      description: Operation available for everyone
      tags:
        - Activities
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  activities:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserActivity'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Creates a new activity
      description: Operation available for everyone.
      tags:
        - Activities
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - activityData
                - poster_image
              properties:
                activityData:
                  $ref: '#/components/schemas/NewActivity'
                  description: JSON string containing activity details
                poster_image:
                  type: string
                  format: binary
                  description: Activity poster image file
                template_files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Optional template files for activity requirements (ordered by added requirements) 
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  activity:
                    $ref: '#/components/schemas/CreatedActivity'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /activities/{activityId}:
    parameters:
      - name: activityId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: Activity id

    get:
      summary: Retrieves information of an specific activity
      description: "Operation available for everyone. \n If the user is subscribed to the activity, it will return the information of the documents the user has uploaded to fullfill the activity's requirements"
      tags:
        - Activities
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  activity:
                    $ref: '#/components/schemas/UserActivity'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Deletes an specific activity.
      description: Operation available for everyone. WARNING all registers retated to the activity get deleted too (registrations, requirements, userDocuments and activityAttachedFiles)
      tags:
        - Activities
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /activities/{activityId}/poster:
    parameters:
      - name: activityId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: Activity id
    
    get:
      summary: Get activity poster image
      description: Operation available for everyone
      tags:
        - Activities
      responses:
        '200':
          content:
            image/*:
              schema:
                type: string
                format: binary
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:

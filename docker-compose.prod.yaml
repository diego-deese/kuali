services:
  db:
    container_name: kuali-db-prod
    image: mysql
    volumes:
      - ./backend/prisma/init.sh:/docker-entrypoint-initdb.d/init.sh
      - kuali-data-prod:/var/lib/mysql
    env_file:
      - ./backend/.env
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
  backend:
    container_name: kuali-backend-prod
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  kuali-data-prod:
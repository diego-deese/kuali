services:
  db:
    container_name: kuali-db-prod
    ports:
      - "3308:3306"
    image: mysql
    volumes:
      - ./backend/prisma/init.sh:/docker-entrypoint-initdb.d/init.sh
      - kuali-data-prod:/var/lib/mysql
    env_file:
      - ./backend/.env
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  backend:
    container_name: kuali-backend-prod
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    ports:
      - "3002:3000"
    env_file:
      - ./backend/.env.prod
    environment:
      - DATABASE_URL=mysql://root:root@kuali-db-prod:3306/kuali?timezone=-06:00
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    depends_on:
      db:
        condition: service_healthy

volumes:
  kuali-data-prod: